<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الكتاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header>
  <div class="wrap top">
    <a href="index.html">المكتبة</a>
    <a href="admin.html">Admin</a>
  </div>
</header>

<div class="wrap">
  <div id="app" class="card">تحميل...</div>
</div>

<script type="module">
  import { loadData, qs, esc } from "./assets/app.js";
  const app = document.getElementById("app");
  const bookId = qs("book");

  try{
    const data = await loadData();
    const book = (data.books||[]).find(b=>b.id===bookId);
    if(!book) throw new Error("الكتاب غير موجود");

    const pages = (data.pages||[])
      .filter(p=>p.bookId===bookId)
      .sort((a,b)=>Number(a.pageNo)-Number(b.pageNo));

    app.innerHTML = `
      <h2>${esc(book.title)}</h2>
      <div class="muted">${esc(book.description||"")}</div>
      <div class="hr"></div>
      <h3>📄 الفهرس</h3>
      ${pages.map(p=>`
        <div style="margin:8px 0">
          <a href="page.html?book=${encodeURIComponent(bookId)}&page=${encodeURIComponent(p.id)}">
            ${p.pageNo}) ${esc(p.title)}
          </a>
        </div>
      `).join("")}
      ${pages.length ? "" : `<div class="muted">لا يوجد صفحات. أضف صفحات من لوحة الأدمن.</div>`}
    `;
  }catch(e){
    app.innerHTML = `<b style="color:#b00020">خطأ</b><pre>${e.message}</pre>`;
  }
</script>
</body>
</html>

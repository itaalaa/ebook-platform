<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الصفحة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header>
  <div class="wrap top">
    <a href="index.html">المكتبة</a>
    <a href="admin.html">Admin</a>
  </div>
</header>

<div class="wrap">
  <div id="app" class="card">تحميل...</div>
</div>

<script>
  function toggleAns(id){
    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
  }
  function checkQuiz(name, correct, resId, explain){
    const chosen = document.querySelector(`input[name="${name}"]:checked`);
    const el = document.getElementById(resId);
    if(!chosen){ el.innerHTML = "اختر إجابة أولاً"; return; }
    const ok = Number(chosen.value) === Number(correct);
    el.innerHTML = ok ? "✅ صحيح" : "❌ خطأ";
    if(explain) el.innerHTML += `<div class="muted" style="margin-top:6px">${explain}</div>`;
  }
</script>

<script type="module">
  import { loadData, qs, esc } from "./assets/app.js";
  const app = document.getElementById("app");
  const bookId = qs("book");
  const pageId = qs("page");

  try{
    const data = await loadData();
    const book = (data.books||[]).find(b=>b.id===bookId);
    if(!book) throw new Error("الكتاب غير موجود");

    const pages = (data.pages||[])
      .filter(p=>p.bookId===bookId)
      .sort((a,b)=>Number(a.pageNo)-Number(b.pageNo));

    const page = pages.find(p=>p.id===pageId);
    if(!page) throw new Error("الصفحة غير موجودة");

    const idx = pages.findIndex(p=>p.id===pageId);
    const prev = idx>0 ? pages[idx-1] : null;
    const next = idx<pages.length-1 ? pages[idx+1] : null;

    const blocks = (data.blocks||[])
      .filter(b=>b.pageId===pageId)
      .sort((a,b)=>Number(a.sort)-Number(b.sort));

    app.innerHTML = `
      <div class="muted">
        <a href="book.html?book=${encodeURIComponent(bookId)}">← الفهرس</a>
        • ${esc(book.title)}
      </div>

      <h2 style="margin-top:10px">${esc(page.title)}</h2>

      <div>${page.contentHtml || ""}</div>

      ${page.imageUrl ? `<div style="margin-top:12px"><img src="${page.imageUrl}"></div>` : ""}

      ${page.videoUrl ? `
        <div style="margin-top:12px">
          <iframe width="100%" height="360" src="${page.videoUrl}" frameborder="0" allowfullscreen></iframe>
        </div>` : ""
      }

      ${page.audioUrl ? `
        <div style="margin-top:12px">
          <button class="btn2" onclick="document.getElementById('aud').play()">▶ تشغيل الصوت</button>
          <button class="btn2" onclick="document.getElementById('aud').pause()">⏸ إيقاف</button>
          <audio id="aud" src="${page.audioUrl}"></audio>
        </div>` : ""
      }

      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        ${prev ? `<a class="btn2" href="page.html?book=${encodeURIComponent(bookId)}&page=${encodeURIComponent(prev.id)}">← السابق</a>` : `<span class="btn2" style="opacity:.4">← السابق</span>`}
        ${next ? `<a class="btn2" href="page.html?book=${encodeURIComponent(bookId)}&page=${encodeURIComponent(next.id)}">التالي →</a>` : `<span class="btn2" style="opacity:.4">التالي →</span>`}
        <a class="btn2" href="book.html?book=${encodeURIComponent(bookId)}">الفهرس</a>
        <a class="btn2" href="index.html">المكتبة</a>
      </div>

      <div class="hr"></div>
      <h3>❓ التفاعلات</h3>

      ${blocks.length ? blocks.map((b,i)=>{
        if(b.type==="toggle"){
          const id = `ans_${i}`;
          return `
            <div class="qa">
              <b>${esc(b.data?.q||"")}</b><br>
              <button class="btn2" onclick="toggleAns('${id}')">إظهار/إخفاء الإجابة</button>
              <div id="${id}" class="answer">${b.data?.a||""}</div>
            </div>`;
        }
        if(b.type==="quiz"){
          const name = `q_${i}`;
          const resId = `r_${i}`;
          const choices = b.data?.choices || [];
          const correct = Number(b.data?.correct || 1);
          const explain = esc(b.data?.explain || "");
          return `
            <div class="qa">
              <b>${esc(b.data?.q||"")}</b>
              <div style="margin-top:8px">
                ${choices.map((c,idx)=>`
                  <label style="display:block;margin:6px 0">
                    <input type="radio" name="${name}" value="${idx+1}"> ${esc(c)}
                  </label>
                `).join("")}
              </div>
              <button class="btn2" onclick="checkQuiz('${name}', ${correct}, '${resId}', '${explain.replace(/'/g,"\\'")}')">تصحيح</button>
              <div id="${resId}" style="margin-top:8px"></div>
            </div>`;
        }
        return "";
      }).join("") : `<div class="muted">لا يوجد تفاعلات</div>`}
    `;
  }catch(e){
    app.innerHTML = `<b style="color:#b00020">خطأ</b><pre>${e.message}</pre>`;
  }
</script>
</body>
</html>
